<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparky Support</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f8fb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 35px 40px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #2c6bed;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 16px;
            color: #555;
        }

        .email-btn {
            color: white;
            background-color: #2c6bed;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            margin-top: 12px;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }

        .email-btn:hover {
            background-color: #1f52b8;
        }

        .footer-text {
            margin-top: 22px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sparky Support</h1>

        <p>
            Need help with storage cleaning, duplicate file removal,
            or app-related issues?
        </p>

        <p>
            Our support team is here to help you with any questions,
            bug reports, or feedback regarding Sparky.
        </p>

        <a class="email-btn" href="mailto:companyofmeva@gmail.com">
            Contact Support
        </a>

        <p class="footer-text">
            We usually respond within 24–48 hours.
        </p>
    </div>
</body>
</html>
